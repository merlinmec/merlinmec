name: Gráfico de contribuições

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6d28d9&color_dots=#ebedf0,#e9d5ff,#c4b5fd,#8b5cf6,#6d28d9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#1c1826,#3b2a63,#5b21b6,#7c3aed,#a78bfa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
